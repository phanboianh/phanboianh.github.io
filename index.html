<!doctype html>
<html lang="vi" data-site>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phan Bội Ánh — Video Editor</title>
<meta name="description" content="Portfolio video editing, sản xuất nội dung và thiết kế.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@300;400;500&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=202610262205">
<!-- nội dung + màu/font chọn trong Trình chỉnh sửa: nạp sớm để trang không bị nháy màu -->
<script src="noi-dung.js?v=202610262205"></script>
<script src="giao-dien.js?v=202610262205"></script>
</head>
<body data-page="video">

<!-- Menu: Video là trang đầu tiên (index.html) → Design → About (CV) → Contact -->
<header class="nav">
  <a href="index.html" class="logo" id="logo"></a>
  <nav>
    <a href="index.html" class="on"><i>01</i>Video</a>
    <a href="design.html"><i>02</i>Design</a>
    <a href="about.html"><i>03</i>About</a>
    <a href="#contact"><i>04</i>Contact</a>
  </nav>
</header>

<section id="video">
  <!-- Đầu trang: tên to + nghề (lấy từ tab About me). Rê chuột vào tên thì hiện ảnh (ảnh "rê chuột") -->
  <div class="vhero" data-reveal>
    <h1 id="vh-name"><img class="vh-ava" id="vh-ava" alt="" hidden><span></span></h1>
    <p class="ab-role" id="vh-role"></p>
    <p class="ab-line" id="vh-line"></p>
  </div>
  <div class="sec-head" data-reveal>
    <h2>Video<sup id="n-video"></sup></h2>
    <p>MV, phim ngắn, bản tin và video truyền thông. Bấm vào từng dự án để xem video kèm chú thích.</p>
  </div>
  <div class="vgrid" id="vgrid"></div>
</section>

<!-- Liên hệ (cuối mọi trang) -->
<section id="contact">
  <img class="c-ava" id="c-ava" alt="" hidden data-reveal>
  <h2 class="big" data-reveal><span id="c1"></span><br><em id="c2"></em></h2>
  <a class="mail" id="mail" data-reveal></a>
  <div class="links" id="links" data-reveal></div>
  <footer class="site mono"><span id="copy"></span><span>Video editing · Design</span></footer>
</section>

<!-- Bảng chi tiết video -->
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Chi tiết video">
  <div class="p-top"><span class="mono" id="p-where"></span><button class="p-close mono" id="p-close">Đóng <b>×</b></button></div>
  <div id="p-content"></div>
</div>

<img class="peek" id="peek" alt="" aria-hidden="true">
<div class="cursor" id="cursor"><b>XEM</b></div>

<script src="site.js?v=202610262205"></script>
</body>
</html>
