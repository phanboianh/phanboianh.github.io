<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trình chỉnh sửa portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  /* Trình chỉnh sửa — chỉ dùng trên máy bạn, không đưa lên mạng */
  :root {
    --bg: #111010; --panel: #1a1918; --card: #222120; --line: #34312f;
    --ink: #f1ece6; --mute: #9b948c; --accent: #ff3b5c; --ok: #4fd18b; --warn: #f5b54a;
    --r: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 'Be Vietnam Pro', system-ui, sans-serif; min-height: 100vh; }
  button, input, textarea { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  button { cursor: pointer; border: 0; background: none; }
  .btn { padding: 9px 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); font-weight: 500; transition: border-color .2s, background .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--mute); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
  .btn.primary:disabled { opacity: .45; cursor: default; }
  .btn.danger:hover { border-color: var(--accent); color: var(--accent); }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--mute); }
  .icon:hover { background: var(--line); color: var(--ink); }
  .icon:disabled { opacity: .25; cursor: default; background: none; }

  /* ---------- thanh trên ---------- */
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 14px 24px; background: rgba(17, 16, 16, .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; font-weight: 700; margin-right: auto; }
  .status { font-size: 13px; color: var(--mute); display: flex; align-items: center; gap: 8px; }
  .status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .status.dirty { color: var(--warn); } .status.dirty::before { background: var(--warn); }
  .tabs { display: flex; gap: 4px; padding: 16px 24px 0; border-bottom: 1px solid var(--line); }
  .tabs button { padding: 10px 16px; border-radius: 10px 10px 0 0; color: var(--mute); font-weight: 500; border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .tabs b { font-weight: 500; color: var(--mute); margin-left: 4px; }

  /* ---------- bố cục 2 cột: danh sách | biểu mẫu ---------- */
  main { padding: 24px; }
  .split { display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; position: sticky; top: 76px; max-height: calc(100vh - 100px); overflow-y: auto; }
  .list .add { width: 100%; margin-bottom: 6px; padding: 12px; border: 1px dashed var(--line); border-radius: 10px; color: var(--mute); font-weight: 500; }
  .list .add:hover { border-color: var(--ink); color: var(--ink); }
  .item { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; cursor: pointer; }
  .item:hover { background: var(--card); }
  .item.on { background: var(--card); box-shadow: inset 0 0 0 1px var(--mute); }
  .item .th { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; background: #000; display: grid; place-items: center; color: var(--mute); font-size: 11px; }
  .item .th img, .item .th video { width: 100%; height: 100%; object-fit: cover; }
  .item b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item small { color: var(--mute); }
  .item small.warn { color: var(--warn); }
  .item .ord { display: flex; flex-direction: column; }
  .empty { padding: 30px 14px; color: var(--mute); text-align: center; }

  .form { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; }
  .form-head { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .form-head h2 { font-size: 20px; margin-right: auto; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: block; margin-bottom: 18px; }
  .field > span { display: block; font-weight: 600; margin-bottom: 6px; }
  .field > span em { font-style: normal; font-weight: 400; color: var(--mute); margin-left: 6px; }
  .field select { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; color: var(--ink); font: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 4px 10px; }
  .chips button { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); color: var(--mute); font-size: 13px; }
  .chips button b { font-weight: 500; opacity: .6; }
  .chips button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .m video { width: 100%; height: 100%; object-fit: contain; }
  .m .badge.vid { left: auto; right: 6px; background: #000; border: 1px solid var(--line); }
  .field input, .field textarea { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; transition: border-color .2s; }
  .field input:focus, .field textarea:focus { border-color: var(--ink); }
  .field textarea { min-height: 150px; resize: vertical; line-height: 1.6; }
  .hint { color: var(--mute); font-size: 12px; margin-top: 6px; }
  .counter { float: right; font-style: normal; color: var(--mute); font-weight: 400; font-size: 12px; }
  .counter.over { color: var(--warn); }

  /* ---------- ảnh / video ---------- */
  .media { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .m { position: relative; border-radius: 10px; overflow: hidden; background: #000; aspect-ratio: 1; border: 1px solid var(--line); }
  .m img { width: 100%; height: 100%; object-fit: contain; }
  .m .badge { position: absolute; left: 6px; top: 6px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
  .m .tools { position: absolute; inset: auto 0 0; display: flex; justify-content: space-between; padding: 4px; background: linear-gradient(transparent, rgba(0, 0, 0, .85)); }
  .m .tools .icon { color: #fff; }
  .drop { border: 1.5px dashed var(--line); border-radius: 10px; display: grid; place-items: center; text-align: center; color: var(--mute); padding: 16px; cursor: pointer; min-height: 140px; transition: border-color .2s, background .2s; }
  .drop:hover, .drop.over { border-color: var(--ink); color: var(--ink); background: var(--card); }
  .drop b { display: block; font-size: 22px; font-weight: 400; }
  .vid { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 12px; }
  .vid video { width: 100%; border-radius: 10px; background: #000; max-height: 360px; }
  .vid .side { display: grid; gap: 12px; align-content: start; }
  .jobs { position: fixed; right: 20px; bottom: 20px; width: min(360px, calc(100% - 40px)); display: grid; gap: 8px; z-index: 25; }
  .job { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
  .job .bar { height: 4px; border-radius: 4px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .job .bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .2s; }
  .job.err { color: var(--accent); border-color: var(--accent); cursor: pointer; }

  .links-row { display: grid; grid-template-columns: 1fr 1fr 1.4fr auto; gap: 8px; margin-bottom: 8px; }
  .links-row input { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; outline: none; }
  .links-row input:focus { border-color: var(--ink); }
  /* xem trước khung ảnh trong form sản phẩm — giống cách hiển thị trên web */
  #framePrev { max-width: 640px; }
  .fp-empty { padding: 30px; text-align: center; color: var(--mute); border: 1.5px dashed var(--line); border-radius: 10px; }
  .fp { background: #0a0909; border-radius: 10px; padding: 12px; border: 1px solid var(--line); }
  .fp img, .fp video { display: block; }
  .fp-frame { position: relative; aspect-ratio: var(--ratio); max-height: 420px; margin: 0 auto; overflow: hidden; display: grid; place-items: center; background: #141212; }
  .fp-bg { position: absolute; inset: -8%; width: 116%; height: 116%; object-fit: cover; filter: blur(22px) brightness(.45) saturate(1.2); }
  .fp-main { position: relative; width: 100%; height: 100%; object-fit: contain; }
  .fp.phu .fp-main { object-fit: cover; object-position: 50% var(--focus); }
  .fp-arrow { position: absolute; top: 50%; left: 8px; width: 32px; height: 32px; margin-top: -16px; border-radius: 50%; background: rgba(10, 9, 9, .6); border: 1px solid rgba(255, 255, 255, .3); color: #fff; }
  .fp-arrow.r { left: auto; right: 8px; }
  .fp-count { position: absolute; right: 8px; bottom: 8px; background: rgba(10, 9, 9, .6); padding: 3px 7px; font-size: 11px; font-weight: 600; }
  .fp-thumbs { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; }
  .fp-thumbs button { flex: none; width: 58px; height: 40px; padding: 0; overflow: hidden; opacity: .45; border: 1px solid transparent; }
  .fp-thumbs button.on { opacity: 1; border-color: var(--ink); }
  .fp-thumbs img, .fp-thumbs video { width: 100%; height: 100%; object-fit: cover; }
  .fp-grid { columns: 2; column-gap: 8px; }
  .fp-grid figure, .fp-doc figure { break-inside: avoid; margin-bottom: 8px; }
  .fp-grid img, .fp-grid video, .fp-doc img, .fp-doc video { width: 100%; height: auto; }
  .fp-doc img, .fp-doc video { width: auto; max-width: 100%; margin: 0 auto; }
  .fp.phu figure img, .fp.phu figure video { width: 100%; aspect-ratio: var(--ratio); object-fit: cover; object-position: 50% var(--focus); }

  .fp-it { display: block; }

  /* ảnh đã cắt (dùng chung cách hiển thị với website) */
  .crop { position: relative; overflow: hidden; max-width: 100%; max-height: 100%; margin: 0 auto; }
  .crop img, .crop video { position: absolute; max-width: none; height: auto !important; aspect-ratio: auto !important; object-fit: fill !important; }
  .m .crop { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .m .crop img, .m .crop video { position: absolute; }
  .m .badge.cut { left: auto; right: 6px; background: #000; border: 1px solid var(--accent); color: var(--accent); }
  .fp-grid figure.full { column-span: all; }
  .m-acts { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -60%); display: grid; gap: 6px; opacity: 0; transition: opacity .2s; z-index: 2; }
  .m:hover .m-acts { opacity: 1; }
  @media (hover: none) { .m-acts { opacity: 1; } }
  .crop-btn { padding: 6px 12px; border-radius: 99px; background: rgba(0, 0, 0, .75); color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .crop-btn:hover { background: #000; }
  .m .badge.cut { top: 30px; }
  .m .badge.row { left: 6px; top: auto; bottom: 40px; background: #000; border: 1px solid var(--ink); }
  .fp-frame .crop { position: relative; z-index: 1; }

  /* khung cắt ảnh kiểu iPhone */
  .cropper { position: fixed; inset: 0; z-index: 50; background: #050505; display: grid; grid-template-rows: auto 1fr auto auto; color: #fff; user-select: none; touch-action: none; }
  .cr-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; }
  .cr-top b { font-size: 16px; }
  .cr-stage { display: grid; place-items: center; padding: 10px 24px; min-height: 0; }
  .cr-img { position: relative; line-height: 0; overflow: hidden; }
  .cr-img img, .cr-img video { max-width: calc(100vw - 48px); max-height: calc(100vh - 230px); width: auto; display: block; pointer-events: none; }
  .cr-box { position: absolute; cursor: move; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .6); outline: 1px solid rgba(255, 255, 255, .9);
    background: linear-gradient(90deg, transparent calc(33.33% - .5px), rgba(255, 255, 255, .35) 33.33%, transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255, 255, 255, .35) 66.66%, transparent calc(66.66% + .5px)),
                linear-gradient(transparent calc(33.33% - .5px), rgba(255, 255, 255, .35) 33.33%, transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255, 255, 255, .35) 66.66%, transparent calc(66.66% + .5px)); }
  .cr-box.drag { box-shadow: 0 0 0 9999px rgba(0, 0, 0, .35); }
  .cr-h { position: absolute; width: 26px; height: 26px; }
  .cr-h.nw, .cr-h.ne, .cr-h.se, .cr-h.sw { border: 0 solid #fff; }
  .cr-h.nw { left: -4px; top: -4px; border-width: 4px 0 0 4px; cursor: nwse-resize; }
  .cr-h.ne { right: -4px; top: -4px; border-width: 4px 4px 0 0; cursor: nesw-resize; }
  .cr-h.se { right: -4px; bottom: -4px; border-width: 0 4px 4px 0; cursor: nwse-resize; }
  .cr-h.sw { left: -4px; bottom: -4px; border-width: 0 0 4px 4px; cursor: nesw-resize; }
  .cr-h.n, .cr-h.s { left: 50%; width: 34px; height: 18px; margin-left: -17px; cursor: ns-resize; }
  .cr-h.e, .cr-h.w { top: 50%; width: 18px; height: 34px; margin-top: -17px; cursor: ew-resize; }
  .cr-h.n { top: -9px; } .cr-h.s { bottom: -9px; } .cr-h.e { right: -9px; } .cr-h.w { left: -9px; }
  .cr-h.n::after, .cr-h.s::after { content: ''; position: absolute; left: 4px; right: 4px; top: 7px; height: 4px; background: #fff; border-radius: 2px; }
  .cr-h.e::after, .cr-h.w::after { content: ''; position: absolute; top: 4px; bottom: 4px; left: 7px; width: 4px; background: #fff; border-radius: 2px; }
  .cr-ratios { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 8px 16px 4px; }
  .cr-ratios button { padding: 7px 14px; border-radius: 99px; background: #1d1c1b; color: #ddd; font-size: 13px; font-weight: 600; }
  .cr-ratios button.on { background: #f5c842; color: #111; }
  .cr-tip { text-align: center; color: #9b948c; font-size: 12px; padding: 4px 16px 16px; }

  .en-box { margin: 22px 0 6px; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 10px; }
  .en-box summary { cursor: pointer; font-weight: 600; }
  .en-box summary em { font-weight: 400; font-style: normal; color: var(--mute); font-size: 12px; }
  .en-box[open] summary { margin-bottom: 14px; }
  .cv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

  /* tab Ảnh trang trí */
  .deco-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .deco-top .chips button { padding: 8px 14px; font-size: 13px; }
  .deco-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  .deco-stage { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: #000; }
  .deco-stage iframe { border: 0; display: block; }
  .deco-stage.pc iframe { width: 1280px; height: 800px; transform-origin: 0 0; }
  .deco-stage.dt { width: 392px; margin: 0 auto; border-radius: 28px; border: 6px solid #2a2928; }
  .deco-stage.dt iframe { width: 380px; height: 760px; }
  .deco-side { position: sticky; top: 76px; padding: 18px; }
  .deco-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .deco-item { display: grid; gap: 4px; padding: 6px; border: 1px solid var(--line); border-radius: 10px; font-size: 11px; color: var(--mute); text-align: center; }
  .deco-item.on { border-color: var(--accent); color: var(--ink); }
  .deco-item .m { position: relative; aspect-ratio: 1; border: 0; }
  .deco-item .m img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
  .deco-list .drop { min-height: 0; aspect-ratio: 1; padding: 6px; font-size: 12px; }
  .deco-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .field.check { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .field.check input { width: auto; }
  .section-title em.dev { text-transform: none; letter-spacing: 0; color: var(--accent); font-style: normal; }
  @media (max-width: 1000px) { .deco-grid { grid-template-columns: 1fr; } .deco-side { position: static; } }

  /* tab Giao diện */
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .look { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 28px; align-items: start; }
  .look-side { position: sticky; top: 76px; }
  .section-title.first { margin-top: 0; padding-top: 0; border-top: 0; }
  .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .preset { display: grid; gap: 8px; padding: 8px 8px 10px; border: 1px solid var(--line); border-radius: 12px; font-weight: 600; text-align: left; }
  .preset:hover { border-color: var(--mute); }
  .preset.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .preset span { height: 54px; border-radius: 8px; display: flex; align-items: end; gap: 6px; padding: 8px; border: 1px solid var(--line); }
  .preset i { width: 18px; height: 18px; border-radius: 50%; }
  .field.color input { height: 44px; padding: 4px; cursor: pointer; }
  .field input[type=range] { padding: 0; border: 0; background: none; accent-color: var(--accent); }
  .lp { background: var(--bg); color: var(--ink); border-radius: 12px; padding: 18px 18px 20px; font-family: var(--sans); border: 1px solid var(--line); overflow: hidden; }
  .lp-nav { display: flex; gap: 12px; align-items: center; font: 700 9px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .lp-nav b { font: var(--tw) 13px/1 var(--title); letter-spacing: 0; text-transform: none; margin-right: auto; }
  .lp-nav .on, .lp-kick { color: var(--accent); }
  .lp-kick { margin-top: 26px; font: 700 9px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .lp-h { font: var(--tw) calc(44px * var(--ts))/.95 var(--title); letter-spacing: calc(-.05em * var(--tls)); margin: 10px 0 12px; }
  .lp-p { font-weight: 300; font-size: 13px; line-height: 1.55; color: var(--ink2); }
  .lp-row { display: flex; align-items: center; justify-content: space-between; margin: 16px 0; padding-top: 14px; border-top: 1px solid rgba(var(--ink-rgb), .14); }
  .lp-num { font: var(--tw) calc(30px * var(--ts))/1 var(--title); color: var(--accent); letter-spacing: calc(-.04em * var(--tls)); }
  .lp-btn { border: 1px solid var(--ink); border-radius: 99px; padding: 7px 12px; font: 700 9px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .lp { position: relative; isolation: isolate; }
  .lp[data-fx="gradient"], .lp[data-fx="vutru"] { background-image: radial-gradient(70% 55% at 88% 0%, rgba(var(--g2-rgb), .75), transparent 70%), radial-gradient(60% 50% at 0% 100%, rgba(var(--g2-rgb), .5), transparent 70%); }
  .lp[data-fx="vutru"]::before { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: calc(var(--sao, .5) * 1.6);
    background: radial-gradient(1px 1px at 12% 18%, rgba(var(--ink-rgb), .9), transparent), radial-gradient(1px 1px at 72% 12%, rgba(var(--ink-rgb), .8), transparent), radial-gradient(1.5px 1.5px at 42% 38%, rgba(var(--ink-rgb), .9), transparent), radial-gradient(1px 1px at 88% 46%, rgba(var(--ink-rgb), .7), transparent), radial-gradient(1px 1px at 22% 62%, rgba(var(--ink-rgb), .8), transparent), radial-gradient(1.5px 1.5px at 64% 70%, rgba(var(--ink-rgb), .9), transparent), radial-gradient(1px 1px at 92% 86%, rgba(var(--ink-rgb), .7), transparent), radial-gradient(1px 1px at 6% 90%, rgba(var(--ink-rgb), .8), transparent); }
  .lp[data-vien="mau"] .lp-cats { padding: 6px; }
  .lp[data-vien="khong"] .lp-cats { background: none; padding: 0; }
  .lp[data-vien="phim"] .lp-cats { border-top: 5px dashed var(--sprocket); border-bottom: 5px dashed var(--sprocket); }
  .lp-cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px; background: var(--strip); }
  .lp-cats i { position: relative; aspect-ratio: var(--cat-ratio); background: var(--card); overflow: hidden; }
  .lp-cats img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.7); }
  .lp-cats b { position: absolute; left: 6px; bottom: 6px; font: var(--tw) 10px/1.1 var(--title); color: #fff; }
  @media (max-width: 1000px) { .look { grid-template-columns: 1fr; } .look-side { position: static; } .grid3 { grid-template-columns: 1fr; } }
  .rows { display: grid; gap: 10px; }
  .row-card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 0; padding-right: 50px; }
  .row-card .field { margin-bottom: 14px; }
  .row-card input, .row-card textarea { background: var(--panel) !important; }
  .row-tools { position: absolute; top: 10px; right: 8px; display: flex; flex-direction: column; }
  .rows > .btn { justify-self: start; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .08em; margin: 26px 0 14px; padding-top: 20px; border-top: 1px solid var(--line); }
